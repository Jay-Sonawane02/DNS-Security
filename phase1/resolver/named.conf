options {
    directory "/var/cache/bind";
    recursion yes;
    allow-query { any; };
    allow-recursion { 172.16.1.0/24; 172.16.2.0/24; };
    // Phase 1: no DNSSEC validation yet -- Phase 3 turns this on.
    dnssec-validation no;
    listen-on { 172.16.2.10; };
    listen-on-v6 { none; };
    querylog yes;
};

// Logs every query this resolver relays/answers, for the README's
// "server-side log of every relayed/answered query" check.
logging {
    channel query_log {
        file "/var/log/named/queries.log" versions 3 size 5m;
        severity info;
        print-time yes;
    };
    category queries { query_log; };
};

// Root hints point at OUR root-ns, not the real Internet root servers --
// this whole hierarchy is self-contained.
zone "." {
    type hint;
    file "/etc/bind/root.hints";
};
