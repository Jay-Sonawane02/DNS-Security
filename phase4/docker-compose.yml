# CS6008 Assignment 2 — Phase 4: Signature Stripping & Downgrade
#
# Identical topology to Phase 3. The ONLY change: the attacker binary
# gains a strip mode (alongside the Phase 2/3 forge mode it already
# has), toggled independently via /tmp/strip.on.
#
# Run scripts/sign-zones.sh BEFORE `docker compose build`, or the
# authoritative servers will fail to start (named.conf points at
# *.zone.signed files that won't exist yet).
#   Run A: bash scripts/sign-zones.sh
#   Run B: bash scripts/sign-zones.sh --omit-example-ds

networks:
  client_net:
    internal: true
    ipam:
      config:
        - subnet: 172.16.1.0/24
  resolver_net:
    internal: true
    ipam:
      config:
        - subnet: 172.16.2.0/24
  auth_net:
    internal: true
    ipam:
      config:
        - subnet: 172.16.3.0/24

services:

  # ---------- client subnet ----------
  client:
    build: ./client
    container_name: client
    hostname: client
    cap_add: [NET_ADMIN]
    networks:
      client_net:
        ipv4_address: 172.16.1.10

  webserver:
    build: ./webserver
    container_name: webserver
    hostname: webserver
    networks:
      client_net:
        ipv4_address: 172.16.1.20

  rogue-web:
    build: ./rogue-web
    container_name: rogue-web
    hostname: rogue-web
    networks:
      client_net:
        ipv4_address: 172.16.1.30

  edge-router:
    build: ./edge-router
    container_name: edge-router
    hostname: edge-router
    cap_add: [NET_ADMIN]
    networks:
      client_net:
        ipv4_address: 172.16.1.2
      resolver_net:
        ipv4_address: 172.16.2.2

  # ---------- resolver subnet ----------
  resolver:
    build: ./resolver
    container_name: resolver
    hostname: resolver
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]  # lets named read its own rndc.key under Docker's default profile
    networks:
      resolver_net:
        ipv4_address: 172.16.2.10

  attacker:
    build: ./attacker
    container_name: attacker
    hostname: attacker
    depends_on: [resolver]
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      FORGE_ENABLED: "0"   # Phase 2/3 single-RR-overwrite mode; off by default
      STRIP_ENABLED: "0"   # Phase 4 strip mode; off by default. Enable with
                            # STRIP_ENABLED=1 or `docker exec attacker touch /tmp/strip.on`
    networks:
      resolver_net:
        ipv4_address: 172.16.2.100

  core-router:
    build: ./core-router
    container_name: core-router
    hostname: core-router
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]  # lets tcpdump write capture files under Docker's default profile
    networks:
      resolver_net:
        ipv4_address: 172.16.2.3
      auth_net:
        ipv4_address: 172.16.3.3

  # ---------- authoritative subnet (signed) ----------
  root-ns:
    build: ./root-ns
    container_name: root-ns
    hostname: root-ns
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]
    networks:
      auth_net:
        ipv4_address: 172.16.3.10

  tld-ns:
    build: ./tld-ns
    container_name: tld-ns
    hostname: tld-ns
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]
    networks:
      auth_net:
        ipv4_address: 172.16.3.20

  domain-ns:
    build: ./domain-ns
    container_name: domain-ns
    hostname: domain-ns
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]
    networks:
      auth_net:
        ipv4_address: 172.16.3.30
