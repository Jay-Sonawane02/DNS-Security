options {
    directory "/var/cache/bind";
    recursion yes;
    allow-query { any; };
    allow-recursion { 172.16.1.0/24; 172.16.2.0/24; };
    dnssec-validation no;   // Phase 3 turns this on
    listen-on { 172.16.2.10; };
    listen-on-v6 { none; };
};

zone "." {
    type hint;
    file "/etc/bind/root.hints";
};
