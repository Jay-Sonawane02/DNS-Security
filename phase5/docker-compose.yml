# CS6008 Assignment 2 — Phase 5: Zone Walking
#
# Same signed/validating topology as Phase 3, with two changes:
#   - core-router is a PLAIN router again (no diversion route) --
#     Phase 5's attacker isn't on-path; it queries domain-ns directly.
#   - attacker runs a dedicated zone_walker tool instead of the
#     Phase 2-4 interceptor, and gets its own route to the
#     authoritative subnet to reach domain-ns.
#
# Run scripts/sign-zones.sh BEFORE `docker compose build`, or the
# authoritative servers will fail to start (named.conf points at
# *.zone.signed files that won't exist yet).
#   Walkable:  bash scripts/sign-zones.sh
#   Fixed:     bash scripts/sign-zones.sh --nsec3

networks:
  client_net:
    internal: true
    ipam:
      config:
        - subnet: 172.16.1.0/24
  resolver_net:
    internal: true
    ipam:
      config:
        - subnet: 172.16.2.0/24
  auth_net:
    internal: true
    ipam:
      config:
        - subnet: 172.16.3.0/24

services:

  # ---------- client subnet ----------
  client:
    build: ./client
    container_name: client
    hostname: client
    cap_add: [NET_ADMIN]
    networks:
      client_net:
        ipv4_address: 172.16.1.10

  webserver:
    build: ./webserver
    container_name: webserver
    hostname: webserver
    networks:
      client_net:
        ipv4_address: 172.16.1.20

  rogue-web:
    build: ./rogue-web
    container_name: rogue-web
    hostname: rogue-web
    networks:
      client_net:
        ipv4_address: 172.16.1.30

  edge-router:
    build: ./edge-router
    container_name: edge-router
    hostname: edge-router
    cap_add: [NET_ADMIN]
    networks:
      client_net:
        ipv4_address: 172.16.1.2
      resolver_net:
        ipv4_address: 172.16.2.2

  # ---------- resolver subnet ----------
  resolver:
    build: ./resolver
    container_name: resolver
    hostname: resolver
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]  # lets named read its own rndc.key under Docker's default profile
    networks:
      resolver_net:
        ipv4_address: 172.16.2.10

  attacker:
    build: ./attacker
    container_name: attacker
    hostname: attacker
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      resolver_net:
        ipv4_address: 172.16.2.100
    environment:
      SERVER_IP: "172.16.3.30"    # domain-ns -- queried directly, no interception involved
      ZONE_APEX: "example.com"
      NEXT_HOP_IP: "172.16.2.3"   # core-router, since domain-ns is on a different subnet

  core-router:
    build: ./core-router
    container_name: core-router
    hostname: core-router
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]  # lets tcpdump write capture files under Docker's default profile
    networks:
      resolver_net:
        ipv4_address: 172.16.2.3
      auth_net:
        ipv4_address: 172.16.3.3

  # ---------- authoritative subnet (signed) ----------
  root-ns:
    build: ./root-ns
    container_name: root-ns
    hostname: root-ns
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]
    networks:
      auth_net:
        ipv4_address: 172.16.3.10

  tld-ns:
    build: ./tld-ns
    container_name: tld-ns
    hostname: tld-ns
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]
    networks:
      auth_net:
        ipv4_address: 172.16.3.20

  domain-ns:
    build: ./domain-ns
    container_name: domain-ns
    hostname: domain-ns
    cap_add: [NET_ADMIN]
    security_opt: ["apparmor:unconfined"]
    networks:
      auth_net:
        ipv4_address: 172.16.3.30
