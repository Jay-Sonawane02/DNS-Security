tls dot-tls {
    cert-file "/etc/bind/pki/resolver.crt";
    key-file  "/etc/bind/pki/resolver.key";
};

options {
    directory "/var/cache/bind";
    recursion yes;
    allow-query { any; };
    allow-recursion { 172.16.1.0/24; 172.16.2.0/24; };
    dnssec-validation yes;   // Phase 3: now actually checking the chain

    // Plain UDP/53 is left enabled deliberately (not removed) -- Phase
    // 7's attempt (iii) ("deny the encrypted transport") only makes
    // sense to test against a resolver that STILL offers a cleartext
    // door, exactly as a real one typically would for compatibility.
    // The interceptor is what blocks port 853 for that attempt, not
    // this config.
    listen-on { 172.16.2.10; };
    listen-on-v6 { none; };
    listen-on port 853 tls dot-tls { 172.16.2.10; };
};

// The root KSK's DNSKEY record, written by scripts/sign-zones.sh.
// This IS the trust anchor: resolver trusts this key directly (it was
// installed here out of band, not learned from the network), and
// everything else -- com's key, example.com's key -- is trusted
// transitively because each parent's DS record vouches for its child.
include "/etc/bind/trust-anchor.conf";

zone "." {
    type hint;
    file "/etc/bind/root.hints";
};
